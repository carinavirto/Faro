<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faro — Guiando tu camino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF3E7;
    --panel:#FFFCF6;
    --maroon:#9C3B49;
    --maroon-deep:#7A2E3A;
    --rose:#E3B3B8;
    --rose-soft:#F2DCDF;
    --olive:#83875C;
    --beam:#F6E6A3;
    --ink:#3B2E2C;
    --ink-soft:#6E5D57;
    --border:#E7D9C4;
    --shadow: 0 1px 0 rgba(59,46,44,0.06);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --cream:#211A17;
      --panel:#2A211D;
      --maroon:#D98A96;
      --maroon-deep:#E3B3B8;
      --rose:#5B3A3D;
      --rose-soft:#3A2A28;
      --olive:#B7BC8C;
      --beam:#F6E6A3;
      --ink:#F2E9DF;
      --ink-soft:#C9BAB0;
      --border:#43342E;
    }
  }
  :root[data-theme="dark"]{
    --cream:#211A17;
    --panel:#2A211D;
    --maroon:#D98A96;
    --maroon-deep:#E3B3B8;
    --rose:#5B3A3D;
    --rose-soft:#3A2A28;
    --olive:#B7BC8C;
    --beam:#F6E6A3;
    --ink:#F2E9DF;
    --ink-soft:#C9BAB0;
    --border:#43342E;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex;
    justify-content:center;
  }

  .app{
    width:100%;
    max-width:640px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:1.75rem 1.25rem 1rem;
    display:flex;
    align-items:center;
    gap:0.9rem;
    border-bottom:1px solid var(--border);
  }

  .logo-wrap{ flex:none; width:68px; height:68px; position:relative; }
  .logo-wrap svg{ width:100%; height:100%; overflow:visible; }

  .beam-group.thinking{ animation: sweep 1.6s linear infinite; }
  @keyframes sweep{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .beam-group.thinking{ animation-duration: 3.2s; }
  }

  .typing-bubble{
    align-self:flex-start;
    display:flex;
    align-items:center;
    gap:0.5rem;
    padding:0.45rem 0.8rem 0.45rem 0.55rem;
    border-radius:14px;
    border-bottom-left-radius:4px;
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
  }
  .typing-bubble .mini-logo{ width:26px; height:26px; flex:none; }
  .typing-bubble span{
    font-size:0.78rem;
    color:var(--ink-soft);
  }

  .brand h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:600;
    font-size:1.9rem;
    color:var(--olive);
    margin:0;
    letter-spacing:0.02em;
  }
  .brand p{
    margin:0.15rem 0 0;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    font-family:'Cormorant Garamond', Georgia, serif;
  }

  .lang-toggle{
    margin-left:auto;
    display:flex;
    border:1px solid var(--border);
    border-radius:999px;
    overflow:hidden;
    flex:none;
  }
  .lang-btn{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-family:'Inter', sans-serif;
    font-size:0.72rem;
    letter-spacing:0.06em;
    padding:0.35rem 0.7rem;
    cursor:pointer;
  }
  .lang-btn.active{
    background:var(--maroon);
    color:var(--cream);
  }

  .disclaimer{
    padding:0.6rem 1.25rem;
    font-size:0.78rem;
    line-height:1.4;
    color:var(--ink-soft);
    background:var(--rose-soft);
    border-bottom:1px solid var(--border);
  }
  .disclaimer strong{ color:var(--maroon-deep); }

  main{
    flex:1;
    overflow-y:auto;
    padding:1.25rem;
    display:flex;
    flex-direction:column;
    gap:0.85rem;
  }

  .msg{
    max-width:82%;
    padding:0.7rem 0.95rem;
    border-radius:14px;
    line-height:1.5;
    font-size:0.95rem;
    white-space:pre-wrap;
  }
  .msg.faro{
    align-self:flex-start;
    background:var(--panel);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
    color:var(--ink);
    box-shadow:var(--shadow);
  }
  .msg.user{
    align-self:flex-end;
    background:var(--maroon);
    color:var(--cream);
    border-bottom-right-radius:4px;
  }
  .msg.faro.pending::after{
    content:"";
  }

  .row-label{
    font-size:0.68rem;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin:0 0.2rem;
    align-self:flex-start;
  }
  .row-label.user{ align-self:flex-end; }

  form{
    display:flex;
    gap:0.6rem;
    padding:1rem 1.25rem 1.4rem;
    border-top:1px solid var(--border);
    background:var(--cream);
  }
  textarea{
    flex:1;
    resize:none;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--ink);
    border-radius:12px;
    padding:0.7rem 0.9rem;
    font-family:inherit;
    font-size:0.95rem;
    line-height:1.4;
    max-height:7rem;
  }
  textarea:focus{ outline:2px solid var(--maroon); outline-offset:1px; }

  button.send{
    flex:none;
    width:46px;
    height:46px;
    border-radius:50%;
    border:none;
    background:var(--maroon);
    color:var(--cream);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  button.send:disabled{ opacity:0.5; cursor:default; }
  button.send svg{ width:18px; height:18px; }

  .hint{
    text-align:center;
    font-size:0.72rem;
    color:var(--ink-soft);
    padding:0 1.25rem 0.9rem;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- rotating beam, pivots from the lantern room -->
        <g class="beam-group" id="beamGroup" style="transform-origin:50px 24px;">
          <path d="M50 24 L97 2 L97 15 Z" fill="var(--beam)" opacity="0.85"/>
        </g>

        <!-- finial -->
        <line x1="50" y1="3" x2="50" y2="9" stroke="var(--maroon)" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="50" cy="3" r="1.4" fill="var(--maroon)"/>

        <!-- dome -->
        <path d="M43 18 Q50 8 57 18 Z" stroke="var(--maroon)" stroke-width="1.6" stroke-linejoin="round"/>

        <!-- lantern room with railing bars -->
        <rect x="41" y="18" width="18" height="9" stroke="var(--maroon)" stroke-width="1.6"/>
        <line x1="45" y1="18" x2="45" y2="27" stroke="var(--maroon)" stroke-width="1"/>
        <line x1="50" y1="18" x2="50" y2="27" stroke="var(--maroon)" stroke-width="1"/>
        <line x1="55" y1="18" x2="55" y2="27" stroke="var(--maroon)" stroke-width="1"/>

        <!-- gallery zigzag bracket -->
        <path d="M37 32 L41 27 L45 32 L50 27 L55 32 L59 27 L63 32"
              stroke="var(--maroon)" stroke-width="1.4" stroke-linejoin="round"/>
        <line x1="35" y1="32" x2="65" y2="32" stroke="var(--maroon)" stroke-width="1.6"/>

        <!-- tapered tower shaft -->
        <path d="M42 32 L58 32 L63 85 L37 85 Z" stroke="var(--maroon)" stroke-width="1.8" stroke-linejoin="round"/>
        <line x1="41" y1="48" x2="59" y2="48" stroke="var(--maroon)" stroke-width="1.2"/>
        <line x1="39.5" y1="66" x2="60.5" y2="66" stroke="var(--maroon)" stroke-width="1.2"/>
        <rect x="47.5" y="38" width="5" height="5" stroke="var(--maroon)" stroke-width="1.2"/>

        <!-- arched door -->
        <path d="M45.5 85 L45.5 77 Q45.5 72 50 72 Q54.5 72 54.5 77 L54.5 85"
              stroke="var(--maroon)" stroke-width="1.4"/>

        <!-- rocks -->
        <path d="M22 90 Q28 83 34 90 Q40 84 46 90 Q52 84 58 90 Q64 84 70 90 Q75 87 78 90"
              stroke="var(--maroon)" stroke-width="1.4" stroke-linejoin="round"/>

        <!-- waves -->
        <path d="M14 95 Q24 90 34 95 T54 95 T74 95 T86 95"
              stroke="var(--rose)" stroke-width="2" stroke-linecap="round"/>
        <path d="M18 99 Q28 95.5 38 99 T58 99 T78 99"
              stroke="var(--rose)" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
      </svg>
    </div>
    <div class="brand">
      <h1>Faro</h1>
      <p>GUIANDO TU CAMINO</p>
    </div>
    <div class="lang-toggle" role="group" aria-label="Idioma mostrado">
      <button type="button" class="lang-btn active" data-lang="es" id="btnEs">ES</button>
      <button type="button" class="lang-btn" data-lang="en" id="btnEn">EN</button>
    </div>
  </header>

  <div class="disclaimer">
    <strong>Faro</strong> ofrece información general, no asesoría legal. Verifica siempre reglas y tarifas en <strong>uscis.gov</strong>, y consulta a un profesional acreditado para tu caso específico.
  </div>

  <main id="messages"></main>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Escribe tu pregunta aquí… (Cuéntame de tu situación)"></textarea>
    <button class="send" type="submit" id="sendBtn" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>

</div>

<script>

const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const btnEs = document.getElementById('btnEs');
const btnEn = document.getElementById('btnEn');

let turns = [];      // what we actually send back to Claude (Spanish "es" text only)
let history = [];    // {role, es, en} for every bubble, so the toggle can re-render instantly
let displayLang = 'es';
let sample = false;

const WELCOME = {
  es: 'Hola, soy Faro. Estoy aquí para ayudarte a entender el camino hacia la ciudadanía estadounidense, paso a paso y sin dejarte a la mitad. ¿Cuánto tiempo llevas con tu tarjeta verde, o en qué parte del proceso estás?',
  en: "Hi, I'm Faro. I'm here to help you understand the path to U.S. citizenship, step by step, without leaving you stuck halfway. How long have you had your green card, or where are you in the process?"
};
const NO_CONNECTION = {
  es: 'Ahora mismo esta vista previa no tiene conexión con Claude — publica esta página para hablar conmigo de verdad.',
  en: "This preview isn't connected to Claude right now — publish this page to actually talk with me."
};

const MINI_LOGO = `
<svg class="mini-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g class="beam-group thinking" style="transform-origin:50px 24px;">
    <path d="M50 24 L97 2 L97 15 Z" fill="var(--beam)" opacity="0.85"/>
  </g>
  <line x1="50" y1="3" x2="50" y2="9" stroke="var(--maroon)" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="50" cy="3" r="1.4" fill="var(--maroon)"/>
  <path d="M43 18 Q50 8 57 18 Z" stroke="var(--maroon)" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="41" y="18" width="18" height="9" stroke="var(--maroon)" stroke-width="1.6"/>
  <line x1="45" y1="18" x2="45" y2="27" stroke="var(--maroon)" stroke-width="1"/>
  <line x1="50" y1="18" x2="50" y2="27" stroke="var(--maroon)" stroke-width="1"/>
  <line x1="55" y1="18" x2="55" y2="27" stroke="var(--maroon)" stroke-width="1"/>
  <path d="M37 32 L41 27 L45 32 L50 27 L55 32 L59 27 L63 32" stroke="var(--maroon)" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="35" y1="32" x2="65" y2="32" stroke="var(--maroon)" stroke-width="1.6"/>
  <path d="M42 32 L58 32 L63 85 L37 85 Z" stroke="var(--maroon)" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="41" y1="48" x2="59" y2="48" stroke="var(--maroon)" stroke-width="1.2"/>
  <line x1="39.5" y1="66" x2="60.5" y2="66" stroke="var(--maroon)" stroke-width="1.2"/>
  <rect x="47.5" y="38" width="5" height="5" stroke="var(--maroon)" stroke-width="1.2"/>
  <path d="M45.5 85 L45.5 77 Q45.5 72 50 72 Q54.5 72 54.5 77 L54.5 85" stroke="var(--maroon)" stroke-width="1.4"/>
  <path d="M22 90 Q28 83 34 90 Q40 84 46 90 Q52 84 58 90 Q64 84 70 90 Q75 87 78 90" stroke="var(--maroon)" stroke-width="1.4" stroke-linejoin="round"/>
</svg>`;

let typingEl = null;
function showTyping(){
  if(typingEl) return;
  typingEl = document.createElement('div');
  typingEl.className = 'typing-bubble';
  typingEl.innerHTML = MINI_LOGO + '<span>Faro está pensando…</span>';
  messagesEl.appendChild(typingEl);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping(){
  if(typingEl){ typingEl.remove(); typingEl = null; }
}

function renderBubble(item){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (item.role === 'user' ? 'user' : 'faro');
  wrap.textContent = item.role === 'user' ? item.es : (item[displayLang] || item.es || '…');
  return wrap;
}

function renderAll(){
  messagesEl.innerHTML = '';
  history.forEach(item => messagesEl.appendChild(renderBubble(item)));
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function pushMessage(role, es, en){
  const item = { role, es, en };
  history.push(item);
  messagesEl.appendChild(renderBubble(item));
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return item;
}

function setLang(lang){
  displayLang = lang;
  btnEs.classList.toggle('active', lang === 'es');
  btnEn.classList.toggle('active', lang === 'en');
  renderAll();
}
btnEs.addEventListener('click', () => setLang('es'));
btnEn.addEventListener('click', () => setLang('en'));

function setThinking(on){
  sendBtn.disabled = on;
  if(on) showTyping(); else hideTyping();
}

async function init(){
  pushMessage('faro', WELCOME.es, WELCOME.en);
  sample = true;
}
init();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if(!text || !sample) return;

  pushMessage('user', text, text);
  turns.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';

  setThinking(true);

  try{
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ turns })
    });
    if(!resp.ok){ const e = new Error('http'); e.code = resp.status === 429 ? 'rate_limited' : 'error'; throw e; }
    const data = await resp.json();
    const es = (data && data.es) ? data.es : 'Perdón, no pude generar una respuesta. Intenta de nuevo.';
    const en = (data && data.en) ? data.en : 'Sorry, I could not generate a reply. Please try again.';
    setThinking(false);
    pushMessage('faro', es, en);
    turns.push({ role: 'assistant', content: JSON.stringify({ es, en }) });
  }catch(err){
    const map = {
      not_granted: { es:'Necesito tu permiso para responder — inténtalo de nuevo.', en:'I need your permission to reply — please try again.' },
      rate_limited: { es:'Muchas preguntas seguidas — espera un momento y vuelve a intentar.', en:'Too many questions in a row — wait a moment and try again.' },
      refused: { es:'No puedo responder eso. Intenta preguntarlo de otra manera.', en:'I cannot answer that. Try asking it a different way.' },
    };
    const fallback = map[err.code] || { es:'Algo salió mal. Intenta de nuevo.', en:'Something went wrong. Please try again.' };
    setThinking(false);
    pushMessage('faro', err.text || fallback.es, fallback.en);
  }
});

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 112) + 'px';
});
</script>
</body>
</html>
